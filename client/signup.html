<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - SocialLite</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div class="logo-badge">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
            <circle cx="9" cy="7" r="4"></circle>
            <line x1="19" y1="8" x2="19" y2="14"></line>
            <line x1="22" y1="11" x2="16" y2="11"></line>
          </svg>
        </div>
        <h1>Create Account</h1>
        <p>Join the community and share your story</p>
      </div>

      <form id="signup-form" novalidate>
        <div class="form-group">
          <label for="username" class="form-label">Username</label>
          <input 
            type="text" 
            id="username" 
            class="form-input" 
            placeholder="e.g. john_doe" 
            required 
            autocomplete="username"
          />
          <div id="username-error" class="form-error-text"></div>
        </div>

        <div class="form-group">
          <label for="email" class="form-label">Email Address</label>
          <input 
            type="email" 
            id="email" 
            class="form-input" 
            placeholder="e.g. john@example.com" 
            required 
            autocomplete="email"
          />
          <div id="email-error" class="form-error-text"></div>
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <input 
            type="password" 
            id="password" 
            class="form-input" 
            placeholder="Minimum 6 characters" 
            required 
            autocomplete="new-password"
          />
          <div id="password-error" class="form-error-text"></div>
        </div>

        <div class="form-group">
          <label for="bio" class="form-label">Bio (Optional)</label>
          <input 
            type="text" 
            id="bio" 
            class="form-input" 
            placeholder="Tell us a little about yourself" 
          />
        </div>

        <div class="form-group">
          <label for="profilePicture" class="form-label">Profile Picture URL (Optional)</label>
          <input 
            type="url" 
            id="profilePicture" 
            class="form-input" 
            placeholder="https://example.com/avatar.jpg" 
          />
          <div class="form-hint">Leave blank to use an automatically generated avatar</div>
        </div>

        <button type="submit" id="signup-btn" class="btn btn-primary btn-block">
          <span>Sign Up</span>
        </button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="index.html">Log In</a>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/signup.js"></script>
</body>
</html>
