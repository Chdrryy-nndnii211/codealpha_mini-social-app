<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile - SocialLite</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Dynamic Navbar -->
  <div id="navbar-placeholder"></div>

  <main class="main-content">
    <div id="profile-loader" style="text-align: center; padding: 3rem;">
      <div class="spinner spinner-dark" style="margin: 0 auto;"></div>
      <p style="margin-top: 0.5rem; color: var(--text-muted);">Loading profile...</p>
    </div>

    <!-- Profile Header Card -->
    <section id="profile-card" class="profile-card" style="display: none;">
      <img src="" alt="Profile picture" id="profile-avatar" class="profile-avatar">
      <h1 id="profile-username" class="profile-username">@username</h1>
      <p id="profile-email" class="profile-email">user@example.com</p>
      <p id="profile-bio" class="profile-bio">User bio here...</p>

      <div class="profile-stats">
        <div class="stat-item">
          <span id="stat-posts" class="stat-number">0</span>
          <span class="stat-label">Posts</span>
        </div>
        <div class="stat-item" id="btn-show-followers" style="cursor: pointer;">
          <span id="stat-followers" class="stat-number">0</span>
          <span class="stat-label">Followers</span>
        </div>
        <div class="stat-item" id="btn-show-following" style="cursor: pointer;">
          <span id="stat-following" class="stat-number">0</span>
          <span class="stat-label">Following</span>
        </div>
      </div>

      <div id="profile-action-container">
        <!-- Injected dynamically: Follow button OR Edit Profile button -->
      </div>
    </section>

    <!-- User's Posts Section -->
    <section id="user-posts-section" style="display: none;">
      <h2 style="font-size: 1.15rem; font-weight: 700; margin-bottom: 1rem; color: var(--text-main);">
        Posts
      </h2>
      <div id="user-posts-container"></div>
    </section>
  </main>

  <!-- Edit Profile Modal -->
  <div id="edit-profile-modal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title">Edit Profile</h3>
        <button type="button" id="close-modal-btn" class="btn-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <form id="edit-profile-form">
        <div class="form-group">
          <label for="edit-bio" class="form-label">Bio</label>
          <textarea id="edit-bio" class="form-textarea" placeholder="Tell us about yourself..." maxlength="200"></textarea>
          <div class="form-hint"><span id="bio-char-count">0</span>/200 characters</div>
        </div>

        <div class="form-group">
          <label for="edit-avatar" class="form-label">Profile Picture URL</label>
          <input type="url" id="edit-avatar" class="form-input" placeholder="https://images.unsplash.com/...">
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 0.75rem; margin-top: 1.5rem;">
          <button type="button" id="cancel-edit-btn" class="btn btn-outline">Cancel</button>
          <button type="submit" id="save-profile-btn" class="btn btn-primary">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Followers / Following List Modal -->
  <div id="users-list-modal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title" id="users-list-title">Followers</h3>
        <button type="button" id="close-users-modal-btn" class="btn-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div id="users-modal-body" style="max-height: 350px; overflow-y: auto; display: flex; flex-direction: column; gap: 0.75rem;">
        <!-- Injected list -->
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
