<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post - SocialLite</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Dynamic Navbar -->
  <div id="navbar-placeholder"></div>

  <main class="post-detail-container">
    <a href="feed.html" class="back-btn-link">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
      <span>Back to Feed</span>
    </a>

    <div id="post-loader" style="text-align: center; padding: 3rem;">
      <div class="spinner spinner-dark" style="margin: 0 auto;"></div>
      <p style="margin-top: 0.5rem; color: var(--text-muted);">Loading post...</p>
    </div>

    <!-- Main Post Container -->
    <div id="single-post-container" style="display: none;"></div>

    <!-- Comments Section Container -->
    <section id="comments-section" class="comments-container" style="display: none;">
      <h3 class="comments-title">Comments (<span id="comment-count-badge">0</span>)</h3>

      <!-- Add Comment Form -->
      <form id="add-comment-form" class="comment-form">
        <input 
          type="text" 
          id="comment-input" 
          class="comment-input" 
          placeholder="Write a comment..." 
          maxlength="500" 
          required 
          autocomplete="off"
        />
        <button type="submit" id="submit-comment-btn" class="btn btn-primary btn-sm">
          <span>Reply</span>
        </button>
      </form>

      <!-- Comments List -->
      <div id="comments-list" class="comments-list"></div>
    </section>
  </main>

  <script src="js/api.js"></script>
  <script src="js/post.js"></script>
</body>
</html>
