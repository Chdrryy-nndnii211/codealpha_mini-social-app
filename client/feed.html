<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feed - SocialLite</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Dynamic Navbar -->
  <div id="navbar-placeholder"></div>

  <main class="main-content">
    <!-- Create Post Card -->
    <section class="create-post-card">
      <form id="create-post-form">
        <div class="create-post-header">
          <img src="" alt="Avatar" id="create-post-avatar" class="create-post-avatar">
          <div class="create-post-input-wrap">
            <textarea 
              id="post-content-input" 
              class="create-post-textarea" 
              placeholder="What's happening? Share with everyone..."
              rows="3"
            ></textarea>
            
            <div id="image-url-box" class="image-url-box">
              <input 
                type="url" 
                id="post-image-input" 
                class="form-input" 
                placeholder="Paste image URL (e.g. https://...)" 
                style="font-size: 0.85rem; padding: 0.5rem 0.75rem;"
              />
            </div>

            <div id="image-preview-container" class="create-post-image-preview">
              <img id="image-preview" src="" alt="Preview">
              <button type="button" id="btn-remove-preview" class="btn-remove-preview" title="Remove image">
                &times;
              </button>
            </div>
          </div>
        </div>

        <div class="create-post-footer">
          <div class="create-post-actions">
            <button type="button" id="toggle-image-btn" class="image-input-toggle">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect width="18" height="18" x="3" y="3" rx="2" ry="2"></rect>
                <circle cx="9" cy="9" r="2"></circle>
                <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"></path>
              </svg>
              <span>Add Image</span>
            </button>
          </div>

          <button type="submit" id="submit-post-btn" class="btn btn-primary btn-sm">
            <span>Post</span>
          </button>
        </div>
      </form>
    </section>

    <!-- Posts Stream -->
    <div id="feed-loader" style="text-align: center; padding: 2rem;">
      <div class="spinner spinner-dark" style="margin: 0 auto;"></div>
      <p style="margin-top: 0.5rem; color: var(--text-muted); font-size: 0.9rem;">Loading feed...</p>
    </div>

    <section id="posts-container" style="display: none;"></section>
  </main>

  <script src="js/api.js"></script>
  <script src="js/feed.js"></script>
</body>
</html>
