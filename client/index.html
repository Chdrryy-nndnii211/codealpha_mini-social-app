<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - SocialLite</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div class="logo-badge">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"></path>
          </svg>
        </div>
        <h1>Welcome Back</h1>
        <p>Log in to connect with your friends and community</p>
      </div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="email" class="form-label">Email Address</label>
          <input 
            type="email" 
            id="email" 
            class="form-input" 
            placeholder="e.g. alex@example.com" 
            required 
            autocomplete="email"
          />
          <div id="email-error" class="form-error-text"></div>
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <input 
            type="password" 
            id="password" 
            class="form-input" 
            placeholder="••••••••" 
            required 
            autocomplete="current-password"
          />
          <div id="password-error" class="form-error-text"></div>
        </div>

        <button type="submit" id="login-btn" class="btn btn-primary btn-block">
          <span>Log In</span>
        </button>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="signup.html">Create an account</a>
      </div>

      <div style="margin-top: 1.5rem; padding: 0.75rem; background: var(--bg-page); border-radius: var(--radius-sm); font-size: 0.8rem; color: var(--text-muted); text-align: center;">
        <strong>Demo Accounts (password: password123):</strong><br>
        <code>alex@example.com</code> &bull; <code>sarah@example.com</code>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
